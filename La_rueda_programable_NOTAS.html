<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La rueda programable</title>
<style>
:root{--bg:#f3f1ea;--card:#fffefb;--ink:#1c2230;--mute:#5b6270;--line:#d6d1c4;--btn:#1c2230;--btnink:#fff;--on:#2f6fed;--cell:#ebe8de;--cell2:#ddd9cb}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#eceff4;--mute:#a1a9b8;--line:#343b48;--btn:#eceff4;--btnink:#14171d;--cell:#262c37;--cell2:#2f3643}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Segoe UI",system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:14px}h1{font:700 1.7rem Georgia,serif;margin:0 0 10px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.sp{flex:1}button{font:600 1rem inherit;min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}button.main{background:var(--btn);color:var(--btnink);border-color:var(--btn)}button.sel{background:var(--on);color:#fff;border-color:var(--on)}button:focus-visible{outline:3px solid var(--on);outline-offset:2px}canvas{display:block;width:100%;height:auto;background:var(--card);border:2px solid var(--line);border-radius:14px;touch-action:none}.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.chk,.picker{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px}.chk.ok{border-color:var(--on)}.chk.no{border-style:dashed}.chk b{display:block}.chk span,.hint{color:var(--mute);font-size:.92rem}.picker{margin:10px 0}.picker .notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.picker button{min-width:76px}.picker .erase{color:#a33}.hidden{display:none!important}label{display:flex;align-items:center;gap:8px;font-weight:600}input[type=range]{width:150px}.tpl{display:none}.tpl table{border-collapse:collapse;width:100%;font-size:12px;margin:12px 0}.tpl td,.tpl th{border:1px solid #444;text-align:center;height:25px}.tpl th:first-child{text-align:left;padding:0 6px;width:180px}@media print{.main-ui{display:none}.tpl{display:block}body{background:#fff;color:#000}}
</style></head><body><div class="app">
<div class="main-ui"><h1>La rueda programable</h1>
<div class="bar"><button class="main" id="play">▶ Reproducir</button><button id="tA" class="sel">Sección A</button><button id="tB">Sección B</button><span class="sp"></span><button id="mAB" class="sel">A y B</button><button id="mA">Solo A</button><button id="mB">Solo B</button></div>
<canvas id="grid" width="1200" height="650" aria-label="Secuenciador de seis carriles y dieciséis pasos"></canvas>
<canvas id="machine" width="1200" height="650" class="hidden" aria-label="Vista de la máquina"></canvas>
<div id="picker" class="picker hidden"><b id="pickTitle">Elige una nota</b><div class="notes" id="noteButtons"></div></div>
<div class="bar"><label>Tempo <input id="bpm" type="range" min="60" max="140" value="90"><output id="bpmo">90</output></label><span class="sp"></span><button id="view" class="main">Ver máquina</button><button id="copy">Copiar A en B</button><button id="clear">Borrar sección</button><button id="reset">Empezar de cero</button></div>
<div class="bar"><button id="link">Copiar enlace</button><button id="print">Imprimir mi pieza</button></div>
<input id="linkout" class="hidden" readonly style="width:100%;padding:10px">
<p class="hint"><b>Cómo se usa.</b> En Xilófono, Sintetizador y Bajo, toca una casilla y elige la nota. En Hi-hat, Caja y Bombo, toca para poner o quitar una bola.</p>
<p class="hint"><b>Comprobaciones técnicas.</b> No son la nota: comprueban solamente los requisitos mínimos.</p><div class="panel" id="checks"></div></div>
<div class="tpl"><div id="printbody"></div></div>
</div><script>
const NOTES=[{n:"Do",f:261.63},{n:"Re",f:293.66},{n:"Mi",f:329.63},{n:"Sol",f:392},{n:"La",f:440},{n:"Do alto",f:523.25}];
const LANES=[{n:"Xilófono",t:"mel",c:"#f06595"},{n:"Sintetizador",t:"mel",c:"#ffa94d"},{n:"Bajo",t:"bass",c:"#9775fa"},{n:"Hi-hat",t:"hh",c:"#adb5bd"},{n:"Caja",t:"sn",c:"#dee2e6"},{n:"Bombo",t:"bd",c:"#868e96"}];
const NR=6,NC=16,GX=190,GY=45,RH=96,CW=(1200-GX-14)/NC;
const empty=()=>Array.from({length:NR},(_,r)=>Array(NC).fill(LANES[r].t==="mel"||LANES[r].t==="bass"?-1:false));
let g=[empty(),empty()],section=0,mode="AB",bpm=90,playing=false,timer=null,step=0,machine=false,pending=null;
const $=id=>document.getElementById(id),grid=$("grid"),gc=grid.getContext("2d"),mach=$("machine"),mc=mach.getContext("2d");
function isNote(r){return LANES[r].t==="mel"||LANES[r].t==="bass"} function active(v){return typeof v==="number"?v>=0:v}
function save(){localStorage.setItem("ruedaNotas",JSON.stringify({g,bpm}))} try{const s=JSON.parse(localStorage.getItem("ruedaNotas"));if(s&&s.g?.length===2&&s.g[0]?.length===NR){g=s.g;bpm=s.bpm||90}}catch(e){}
let ac,master,noise;function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state==="suspended")ac.resume()}
function sound(r,v,t){audio();const lane=LANES[r],gain=ac.createGain();gain.connect(master);if(isNote(r)){const o=ac.createOscillator(),f=NOTES[v].f*(lane.t==="bass"?.5:1);o.type=lane.t==="bass"?"triangle":"sine";o.frequency.value=f;gain.gain.setValueAtTime(.5,t);gain.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(gain);o.start(t);o.stop(t+.5)}else if(lane.t==="bd"){const o=ac.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);gain.gain.setValueAtTime(1,t);gain.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(gain);o.start(t);o.stop(t+.35)}else{const s=ac.createBufferSource(),f=ac.createBiquadFilter();s.buffer=noise;f.type=lane.t==="sn"?"bandpass":"highpass";f.frequency.value=lane.t==="sn"?1900:7500;gain.gain.setValueAtTime(.6,t);gain.gain.exponentialRampToValueAtTime(.001,t+(lane.t==="sn"?.15:.05));s.connect(f);f.connect(gain);s.start(t);s.stop(t+.2)}}
function drawGrid(){const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink"),mut=getComputedStyle(document.documentElement).getPropertyValue("--mute"),cell=getComputedStyle(document.documentElement).getPropertyValue("--cell"),cell2=getComputedStyle(document.documentElement).getPropertyValue("--cell2");gc.clearRect(0,0,1200,650);gc.font="600 16px system-ui";gc.textBaseline="middle";for(let k=0;k<NC;k++){gc.fillStyle=mut;gc.textAlign="center";gc.fillText(k+1,GX+k*CW+CW/2,22)}for(let r=0;r<NR;r++){const y=GY+r*RH,l=LANES[r];gc.fillStyle=l.c;gc.fillRect(10,y+12,7,RH-24);gc.fillStyle=ink;gc.textAlign="left";gc.fillText(l.n,28,y+RH/2);for(let k=0;k<NC;k++){const x=GX+k*CW,v=g[section][r][k];gc.fillStyle=Math.floor(k/4)%2?cell:cell2;gc.beginPath();gc.roundRect(x+3,y+5,CW-6,RH-10,8);gc.fill();if(active(v)){gc.fillStyle=l.c;gc.beginPath();gc.arc(x+CW/2,y+RH/2,18,0,7);gc.fill();if(isNote(r)){gc.fillStyle="#111";gc.font="700 11px system-ui";gc.textAlign="center";gc.fillText(NOTES[v].n.replace(" alto","↑"),x+CW/2,y+RH/2);gc.font="600 16px system-ui"}}}if(r===2||r===5){gc.strokeStyle=mut;gc.globalAlpha=.35;gc.beginPath();gc.moveTo(8,y+RH);gc.lineTo(1190,y+RH);gc.stroke();gc.globalAlpha=1}}}
function drawMachine(){mc.clearRect(0,0,1200,650);mc.fillStyle="#161b22";mc.fillRect(0,0,1200,650);mc.fillStyle="#222a35";mc.strokeStyle="#3a4556";mc.lineWidth=4;mc.beginPath();mc.arc(600,235,155,0,7);mc.fill();mc.stroke();for(let k=0;k<NC;k++){const a=Math.PI/2+k*Math.PI/8;for(let r=0;r<NR;r++){const v=g[section][r][k],rad=55+r*18;mc.fillStyle=active(v)?LANES[r].c:"#3a4556";mc.beginPath();mc.arc(600+rad*Math.cos(a),235+rad*Math.sin(a),active(v)?8:3,0,7);mc.fill()}}for(let r=0;r<NR;r++){const x=250+r*140,y=545,l=LANES[r];mc.strokeStyle=l.c;mc.lineWidth=8;mc.beginPath();mc.moveTo(600+(r-2.5)*5,390);mc.quadraticCurveTo(x,430,x,y-35);mc.stroke();mc.fillStyle=l.c;mc.beginPath();mc.roundRect(x-55,y-25,110,55,10);mc.fill();mc.fillStyle="#111";mc.textAlign="center";mc.font="700 15px system-ui";mc.fillText(l.n,x,y+4)}mc.fillStyle="#e6ebf2";mc.textAlign="left";mc.font="700 28px Georgia";mc.fillText("Sección "+"AB"[section],25,42)}
function redraw(){drawGrid();drawMachine()}
function hit(e){const b=grid.getBoundingClientRect(),x=(e.clientX-b.left)*1200/b.width,y=(e.clientY-b.top)*650/b.height,r=Math.floor((y-GY)/RH),k=Math.floor((x-GX)/CW);return r>=0&&r<NR&&k>=0&&k<NC?{r,k}:null}
function openNotes(r,k){pending={r,k};$("pickTitle").textContent=LANES[r].n+" · paso "+(k+1)+": elige una nota";const box=$("noteButtons");box.innerHTML="";NOTES.forEach((n,i)=>{const b=document.createElement("button");b.type="button";b.textContent=n.n;b.onclick=()=>{g[section][r][k]=i;sound(r,i,ac?ac.currentTime+.01:0);$("picker").classList.add("hidden");save();redraw();check()};box.appendChild(b)});const del=document.createElement("button");del.type="button";del.className="erase";del.textContent="Quitar";del.onclick=()=>{g[section][r][k]=-1;$("picker").classList.add("hidden");save();redraw();check()};box.appendChild(del);$("picker").classList.remove("hidden")}
grid.addEventListener("pointerdown",e=>{audio();const h=hit(e);if(!h)return;if(isNote(h.r))openNotes(h.r,h.k);else{g[section][h.r][h.k]=!g[section][h.r][h.k];if(g[section][h.r][h.k])sound(h.r,true,ac.currentTime+.01);save();redraw();check()}});
function playStep(){const sec=mode==="AB"?Math.floor((step%32)/16):mode==="A"?0:1,k=step%16;section=sec;for(let r=0;r<NR;r++){const v=g[sec][r][k];if(active(v))sound(r,v,ac.currentTime+.01)}step++;redraw()}
function start(){audio();playing=true;step=0;playStep();timer=setInterval(playStep,60000/bpm/2);$("play").textContent="■ Parar"}function stop(){playing=false;clearInterval(timer);$("play").textContent="▶ Reproducir"}
function check(){const A=g[0],B=g[1],used=(S,r)=>S[r].some(active),same=r=>A[r].every((v,k)=>v===B[r][k]);const perc=[3,4,5].filter(r=>used(A,r)).length,accent=active(A[4][0])||active(A[5][0]),pulse= same(4)&&same(5);let last=-1;for(let k=15;k>=0&&last<0;k--)if([0,1].some(r=>active(B[r][k])))last=k;const endDo=last>=0&&[0,1].some(r=>B[r][last]===0||B[r][last]===5),hasMel=[0,1].some(r=>used(A,r));let countA=A.flat().filter(active).length,countB=B.flat().filter(active).length,diff=0;for(let r=0;r<NR;r++)for(let k=0;k<NC;k++)if(A[r][k]!==B[r][k])diff++;const items=[[perc>=2&&accent&&pulse,"Pulso y ritmo",!pulse?"B debe conservar la caja y el bombo de A.":"Usa al menos dos percusiones y empieza con caja o bombo."],[hasMel&&endDo,"Melodía",last<0?"Falta la melodía de B.":endDo?"La última nota de B es Do.":"La última nota de B debe ser Do."],[countA>=6&&countB>=6&&diff>=10,"Forma y contraste","Bolas en A: "+countA+", en B: "+countB+". Cambios: "+diff+" de 10."]];$("checks").innerHTML=items.map(i=>'<div class="chk '+(i[0]?"ok":"no")+'"><b>'+(i[0]?"● ":"○ ")+i[1]+'</b><span>'+i[2]+'</span></div>').join("")}
$("play").onclick=()=>playing?stop():start();$("tA").onclick=()=>{section=0;$("tA").classList.add("sel");$("tB").classList.remove("sel");redraw()};$("tB").onclick=()=>{section=1;$("tB").classList.add("sel");$("tA").classList.remove("sel");redraw()};["AB","A","B"].forEach(x=>$("m"+x).onclick=()=>{mode=x;["AB","A","B"].forEach(y=>$("m"+y).classList.toggle("sel",x===y))});$("bpm").value=bpm;$("bpmo").value=bpm;$("bpm").oninput=e=>{bpm=+e.target.value;$("bpmo").value=bpm;save();if(playing){stop();start()}};$("view").onclick=()=>{machine=!machine;grid.classList.toggle("hidden",machine);mach.classList.toggle("hidden",!machine);$("picker").classList.add("hidden");$("view").textContent=machine?"Ver rejilla":"Ver máquina"};$("copy").onclick=()=>{g[1]=g[0].map(r=>r.slice());section=1;save();redraw();check()};$("clear").onclick=()=>{g[section]=empty();save();redraw();check()};$("reset").onclick=()=>{g=[empty(),empty()];section=0;save();redraw();check()};
function encode(){return btoa(unescape(encodeURIComponent(JSON.stringify({g,bpm})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/," ").trim()}function decode(x){try{return JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}}const h=location.hash.slice(1);if(h){const d=decode(h);if(d?.g){g=d.g;bpm=d.bpm||90}}
$("link").onclick=()=>{const u=location.href.split("#")[0]+"#"+encode();$("linkout").value=u;$("linkout").classList.remove("hidden");navigator.clipboard?.writeText(u)};$("print").onclick=()=>{let h='<p><b>Tempo:</b> '+bpm+'</p>';for(let s=0;s<2;s++){h+='<table><tr><th>Sección '+"AB"[s]+'</th>';for(let k=1;k<=16;k++)h+='<th>'+k+'</th>';h+='</tr>';for(let r=0;r<NR;r++){h+='<tr><th>'+LANES[r].n+'</th>';for(let k=0;k<NC;k++){const v=g[s][r][k];h+='<td>'+(active(v)?(isNote(r)?NOTES[v].n:'●'):'')+'</td>'}h+='</tr>'}h+='</table>'}$("printbody").innerHTML=h;window.print()};redraw();check();
</script></body></html>
